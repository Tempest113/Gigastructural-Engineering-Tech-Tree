name: Deploy spike to GitHub Pages

# Throwaway spike (see deploy-spike/README.md) proving the GitHub Pages delivery path before
# anything depends on it. Deletable, along with deploy-spike/, once Stage 3 has a real deploy
# workflow of its own.
#
# Scoped to deploy-spike/** changes (plus this file) specifically so it never runs on ordinary
# pipeline commits and never competes with pipeline CI.

on:
  push:
    branches: [master]
    paths:
      - "deploy-spike/**"
      - ".github/workflows/deploy-spike-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload deploy-spike/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-spike

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
